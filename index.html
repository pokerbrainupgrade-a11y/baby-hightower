<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baby Hightower</title>
<meta name="description" content="Q &amp; Staci · due May 11, 2027">
<meta name="theme-color" content="#FFF9F2">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=yes">

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-64.png" sizes="64x64" type="image/png">

<!-- iOS home-screen install -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Baby H">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="preload" href="fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" hidden>
  <header class="topbar">
    <button class="topbar-brand" data-go="today" aria-label="Today">
      <img src="icons/icon.svg" alt="" width="26" height="26">
      <span class="serif">Baby <i>Hightower</i></span>
    </button>
    <div class="topbar-right">
      <span id="weekMini" class="week-mini"></span>
      <button id="syncDot" class="sync-dot" data-state="off" aria-label="Sync status" title="Not syncing"></button>
      <button id="btnSettings" class="icon-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="Sections">
    <button data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg><span>Today</span></button>
    <button data-tab="timeline"><svg viewBox="0 0 24 24"><path d="M6 3v18"/><circle cx="6" cy="7" r="2" fill="currentColor" stroke="none"/><circle cx="6" cy="15" r="2" fill="currentColor" stroke="none"/><path d="M11 7h9M11 15h9"/></svg><span>Timeline</span></button>
    <button data-tab="checklists"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m8 12 3 3 5-6"/></svg><span>Lists</span></button>
    <button data-tab="notes" aria-label="Notes &amp; Questions"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-5 4.5V16a2.5 2.5 0 0 1-1-2z"/><path d="M8 8h8M8 11.5h5"/></svg><span>Notes &amp; Qs</span></button>
    <button data-tab="resources"><svg viewBox="0 0 24 24"><path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3z"/><path d="M21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/></svg><span>Resources</span></button>
  </nav>
</div>

<!-- first-launch identity -->
<div id="identity" class="modal" hidden>
  <form class="modal-card" id="identityForm">
    <img src="icons/icon.svg" alt="" width="56" height="56" class="modal-icon">
    <h2 class="serif">Who's this?</h2>
    <div class="who">
      <label><input type="radio" name="user" value="Q" required><span>I'm Q</span></label>
      <label><input type="radio" name="user" value="Staci" required><span>I'm Staci</span></label>
    </div>
    <label class="field">
      <span>Household code</span>
      <input name="code" type="text" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="same on both phones" required minlength="4">
      <small>Your shared key for sync. Make it long and private; type it identically on both phones.</small>
    </label>
    <button type="submit" class="btn primary big">Let's go</button>
  </form>
</div>

<div id="toast" class="toast" hidden></div>
<noscript>Baby Hightower needs JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
